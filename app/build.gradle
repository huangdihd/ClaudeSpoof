plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arin.claudespoof'
    compileSdk 34

    defaultConfig {
        applicationId "com.arin.claudespoof"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Material 3 组件库（含 AppCompat）
    implementation 'com.google.android.material:material:1.12.0'

    // 若 api.xposed.info 拉取失败，改用手动方式：
    // 下载 XposedBridgeApi.jar 放入 app/libs/，然后把下一行替换为
    // compileOnly files('libs/XposedBridgeApi.jar')
    compileOnly 'de.robv.android.xposed:api:82'
}
