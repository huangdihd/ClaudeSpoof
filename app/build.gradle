plugins {
    id 'com.android.application'
}

// 本地签名配置（keystore.properties 不入库；没有该文件时构建未签名的 release）
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withReader('UTF-8') { keystoreProps.load(it) }
}

android {
    namespace 'com.arin.claudespoof'
    compileSdk 34

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.arin.claudespoof"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Material 3 组件库（含 AppCompat）
    implementation 'com.google.android.material:material:1.12.0'

    // 若 api.xposed.info 拉取失败，改用手动方式：
    // 下载 XposedBridgeApi.jar 放入 app/libs/，然后把下一行替换为
    // compileOnly files('libs/XposedBridgeApi.jar')
    compileOnly 'de.robv.android.xposed:api:82'
}
